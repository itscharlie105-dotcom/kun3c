<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230B0F14'/%3E%3Crect%20x='6'%20y='9'%20width='20'%20height='13'%20rx='2'%20fill='none'%20stroke='%2322D3EE'%20stroke-width='2'/%3E%3Cpath%20d='M12%2026h8'%20stroke='%2322D3EE'%20stroke-width='2'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">

<body data-title="訂單紀錄" data-page="orders">
<a class="sr-only" href="#main">跳到主要內容</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <nav class="crumb" aria-label="麵包屑">
      <a href="index.html">首頁</a><span>/</span><span>訂單紀錄</span>
    </nav>

    <div class="section">
      <div class="section-head">
        <h1 class="section-title">訂單紀錄</h1>
        <p>你在這台電腦送出過的訂單都會留在這裡，隨時可以重新複製內容再傳一次給我們。</p>
      </div>

      <div class="callout" style="margin-bottom:20px">
        <p>紀錄只存在你目前使用的這台電腦（瀏覽器）裡，不會上傳到任何地方，換一台電腦或清除瀏覽器資料就會消失。
          訂單要成立，仍請把訂單內容用 <span data-cfg="contactChannel">Facebook</span> 傳給我們。</p>
      </div>

      <div class="orders-head" id="orders-tools" hidden>
        <p class="result-count" id="orders-count" role="status"></p>
        <button class="btn btn-ghost btn-sm" type="button" id="clear-orders">清除全部紀錄</button>
      </div>

      <div class="order-list" id="orders-view"></div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
