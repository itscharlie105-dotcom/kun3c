<body data-title="選購小幫手" data-page="helper">
<a class="sr-only" href="#main">跳到主要內容</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <nav class="crumb" aria-label="麵包屑">
      <a href="index.html">首頁</a><span>/</span><span>選購小幫手</span>
    </nav>

    <div class="section">
      <div class="section-head">
        <h1 class="section-title">不知道該買哪一台？</h1>
        <p>回答下面四個問題，我們從店裡<strong>現有的機器</strong>挑出最適合你的，
          並且告訴你為什麼推薦這台。看不懂規格也沒關係。</p>
      </div>

      <form class="panel panel-pad quiz" id="quiz-form" novalidate>

        <fieldset class="quiz-block">
          <legend class="quiz-q"><span class="quiz-no">1</span>主要拿來做什麼？
            <small>可以複選，不選也可以</small></legend>
          <div class="quiz-options" id="quiz-uses"></div>
        </fieldset>

        <fieldset class="quiz-block">
          <legend class="quiz-q"><span class="quiz-no">2</span>想要哪一種？</legend>
          <div class="quiz-options">
            <label class="quiz-option">
              <input type="radio" name="type" value="laptop">
              <span class="quiz-option-main">筆記型電腦</span>
              <span class="quiz-option-sub">可以帶著走，螢幕鍵盤都內建</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="type" value="desktop">
              <span class="quiz-option-main">桌上型主機</span>
              <span class="quiz-option-sub">放家裡用，螢幕鍵盤要另外準備</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="type" value="any" checked>
              <span class="quiz-option-main">都可以</span>
              <span class="quiz-option-sub">看哪台比較划算</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="quiz-block">
          <legend class="quiz-q"><span class="quiz-no">3</span>預算大概多少？</legend>
          <div class="quiz-options">
            <label class="quiz-option">
              <input type="radio" name="budget" value="0-5000">
              <span class="quiz-option-main">5,000 元以內</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="budget" value="5000-10000">
              <span class="quiz-option-main">5,000～10,000 元</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="budget" value="10000-20000">
              <span class="quiz-option-main">10,000～20,000 元</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="budget" value="20000-0">
              <span class="quiz-option-main">20,000 元以上</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="budget" value="any" checked>
              <span class="quiz-option-main">還不確定</span>
              <span class="quiz-option-sub">先看看有什麼</span>
            </label>
          </div>
        </fieldset>

        <fieldset class="quiz-block">
          <legend class="quiz-q"><span class="quiz-no">4</span>最在意哪一點？</legend>
          <div class="quiz-options">
            <label class="quiz-option">
              <input type="radio" name="care" value="price" checked>
              <span class="quiz-option-main">便宜就好</span>
              <span class="quiz-option-sub">能用就好，省錢最重要</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="care" value="power">
              <span class="quiz-option-main">跑得順一點</span>
              <span class="quiz-option-sub">不想用到一半卡卡的</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="care" value="look">
              <span class="quiz-option-main">外觀新一點</span>
              <span class="quiz-option-sub">不想要太多刮痕</span>
            </label>
            <label class="quiz-option">
              <input type="radio" name="care" value="warranty">
              <span class="quiz-option-main">保固長一點</span>
              <span class="quiz-option-sub">買了比較安心</span>
            </label>
          </div>
        </fieldset>

        <div class="hero-actions" style="margin-top:8px">
          <button class="btn btn-primary" type="submit">看看推薦哪幾台</button>
          <button class="btn btn-ghost" type="button" id="quiz-reset">重新回答</button>
        </div>
      </form>

      <section id="quiz-result" hidden aria-live="polite"></section>
    </div>
  </div>
</main>
