<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>全部商品｜汐止阿坤3C工作室</title>
<meta name="description" content="二手筆電、桌上型主機、4K電視與顯示器、顯卡與記憶體等中古3C商品列表，可依類別、價格、成色、保固與庫存篩選，並支援關鍵字搜尋與排序。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230B0F14'/%3E%3Crect%20x='6'%20y='9'%20width='20'%20height='13'%20rx='2'%20fill='none'%20stroke='%2322D3EE'%20stroke-width='2'/%3E%3Cpath%20d='M12%2026h8'%20stroke='%2322D3EE'%20stroke-width='2'%20stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title="全部商品" data-page="products">
<a class="sr-only" href="#main">跳到主要內容</a>
<header class="site-header" id="site-header"></header>

<main id="main">
  <div class="wrap">
    <nav class="crumb" aria-label="麵包屑">
      <a href="index.html">首頁</a><span>/</span><span>全部商品</span>
    </nav>

    <div class="section">
      <div class="section-head">
        <h1 class="section-title">全部商品</h1>
        <p>所有機器都實機檢測過、誠實標示成色。篩選後的網址可以直接複製貼給客人。</p>
      </div>

      <div class="shop-layout">
        <aside class="filter-aside" id="filter-aside" data-collapsed="true" aria-label="篩選條件">
          <button class="btn btn-ghost filter-toggle" type="button" id="filter-toggle"
                  aria-expanded="false" aria-controls="filter-form">
            <span>篩選條件</span><span aria-hidden="true">＋</span>
          </button>
          <form class="filter-body" id="filter-form" aria-label="商品篩選條件"></form>
        </aside>

        <div>
          <div class="shop-toolbar">
            <div class="search-box">
              <span data-icon="search"></span>
              <label class="sr-only" for="keyword">搜尋商品</label>
              <input class="input" type="search" id="keyword" placeholder="搜尋名稱、品牌或規格，例如 ThinkPad、RTX、16GB">
            </div>
            <div class="sort-field">
              <label for="sort">排序</label>
              <select class="input" id="sort">
                <option value="new">最新上架</option>
                <option value="price-asc">價格由低到高</option>
                <option value="price-desc">價格由高到低</option>
              </select>
            </div>
            <p class="result-count" id="result-count" role="status">載入中…</p>
          </div>

          <div class="product-grid" id="product-grid"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer" id="site-footer"></footer>
<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/svg.js"></script>
<script src="js/app.js"></script>
</body>
</html>
